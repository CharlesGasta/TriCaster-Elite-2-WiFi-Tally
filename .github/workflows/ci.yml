name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  manager-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile TriCaster_Elite2_Tally_Manager.py
      - name: Manager JavaScript syntax check
        run: |
          python - <<'PY'
          import TriCaster_Elite2_Tally_Manager as manager
          script = manager.PAGE.split("<script>", 1)[1].split("</script>", 1)[0]
          open("/tmp/tally-manager.js", "w", encoding="utf-8").write(script)
          PY
          node --check /tmp/tally-manager.js
      - name: Manager production smoke tests
        run: |
          python - <<'PY'
          import time
          import TriCaster_Elite2_Tally_Manager as m

          now = time.time()
          m.manager_config["api_token"] = "CI_TEST_TOKEN"
          m.manager_config["expected_tally_count"] = 1
          m.devices.clear()
          m.devices["TALLY-01"] = {
              "name": "TALLY-01",
              "ip": "192.168.1.81",
              "tricaster": "192.168.1.50",
              "camera": 1,
              "firmware": "4.1.0",
              "rssi": -55,
              "bssid": "00:11:22:33:44:55",
              "channel": 1,
              "wifi_state": "connected",
              "state": "off",
              "tricaster_latency_ms": 12,
              "last_tally_age_ms": 100,
              "last_seen": now,
          }
          report = m.preflight_report()
          assert report["verdict"] == "GO", report

          m.devices["TALLY-02"] = dict(m.devices["TALLY-01"], name="TALLY-02", camera=2)
          m.manager_config["expected_tally_count"] = 2
          report = m.preflight_report()
          assert report["verdict"] == "NO-GO", report
          assert any(x["title"] == "Doublon IP" for x in report["checks"])

          # Regression test: card handlers must use data-tally rather than injecting
          # JSON-quoted names inside HTML attributes, which breaks checkbox/actions.
          assert "quotedName" not in m.PAGE
          assert 'onchange="otaToggle(this.dataset.tally,this.checked)"' in m.PAGE
          assert 'onclick="uploadFirmware(\\\'single\\\',this.dataset.tally)"' in m.PAGE

          print("Manager V4.1 production smoke tests OK")
          PY

  manager-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Manager EXE
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console --name TriCaster_Elite2_Tally_Manager_V4_1 TriCaster_Elite2_Tally_Manager.py
      - name: Upload Manager EXE
        uses: actions/upload-artifact@v4
        with:
          name: TriCaster_Elite2_Tally_Manager_V4_1_Windows
          path: dist/TriCaster_Elite2_Tally_Manager_V4_1.exe
          if-no-files-found: error

  esp8266-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
      - name: Compile firmware
        run: |
          mkdir -p /tmp/TriCasterTally
          cp TriCaster_Elite2_Tally_ESP8266.ino /tmp/TriCasterTally/TriCasterTally.ino
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir "$GITHUB_WORKSPACE/build" /tmp/TriCasterTally
          cp TriCaster_Elite2_Tally_ESP8266.ino "$GITHUB_WORKSPACE/build/TriCaster_Elite2_Tally_ESP8266.ino"
          cp "$GITHUB_WORKSPACE/build/TriCasterTally.ino.bin" "$GITHUB_WORKSPACE/build/TriCaster_Elite2_Tally_ESP8266.bin"

          rm -rf /tmp/TriCasterTally04
          mkdir -p /tmp/TriCasterTally04
          cp TriCaster_Elite2_Tally_ESP8266_TALLY04.ino /tmp/TriCasterTally04/TriCasterTally04.ino
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir "$GITHUB_WORKSPACE/build_tally04" /tmp/TriCasterTally04
          cp TriCaster_Elite2_Tally_ESP8266_TALLY04.ino "$GITHUB_WORKSPACE/build_tally04/TriCaster_Elite2_Tally_ESP8266_TALLY04.ino"
          cp "$GITHUB_WORKSPACE/build_tally04/TriCasterTally04.ino.bin" "$GITHUB_WORKSPACE/build_tally04/TriCaster_Elite2_Tally_ESP8266_TALLY04.bin"

      - name: Upload generic firmware source + binary
        uses: actions/upload-artifact@v4
        with:
          name: TriCaster_Elite2_Tally_ESP8266_Source_and_BIN
          path: |
            build/TriCaster_Elite2_Tally_ESP8266.ino
            build/TriCaster_Elite2_Tally_ESP8266.bin
          if-no-files-found: error

      - name: Upload TALLY-04 source + binary
        uses: actions/upload-artifact@v4
        with:
          name: TriCaster_Elite2_Tally_ESP8266_TALLY04_Source_and_BIN
          path: |
            build_tally04/TriCaster_Elite2_Tally_ESP8266_TALLY04.ino
            build_tally04/TriCaster_Elite2_Tally_ESP8266_TALLY04.bin
          if-no-files-found: error
