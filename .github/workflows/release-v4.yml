name: Publish V4.2 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows Manager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console --name TriCaster_Elite2_Tally_Manager TriCaster_Elite2_Tally_Manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: manager-release
          path: dist/TriCaster_Elite2_Tally_Manager.exe
          if-no-files-found: error

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
      - name: Build ESP8266 firmware
        run: |
          mkdir -p /tmp/TriCasterTally build
          cp TriCaster_Elite2_Tally_ESP8266.ino /tmp/TriCasterTally/TriCasterTally.ino
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir "$GITHUB_WORKSPACE/build" /tmp/TriCasterTally
          cp TriCaster_Elite2_Tally_ESP8266.ino build/TriCaster_Elite2_Tally_ESP8266_V4_2.ino
          cp build/TriCasterTally.ino.bin build/TriCaster_Elite2_Tally_ESP8266_V4_2.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: |
            build/TriCaster_Elite2_Tally_ESP8266_V4_2.ino
            build/TriCaster_Elite2_Tally_ESP8266_V4_2.bin
          if-no-files-found: error

  release:
    needs: [build-manager, build-firmware]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manager-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release
          path: release
      - name: Build complete ZIP
        run: |
          cp TriCaster_Elite2_Tally_Manager.py release/
          cp README.md release/
          cp TEST_PLAN_V4_2.md release/
          cat > release/LISEZ-MOI.txt <<'EOF'
          TriCaster Elite 2 WiFi Tally V4.2.0

          Fichiers principaux:
          - TriCaster_Elite2_Tally_Manager.exe : Manager Windows
          - TriCaster_Elite2_Tally_ESP8266_V4_2.ino : source Arduino / flash USB
          - TriCaster_Elite2_Tally_ESP8266_V4_2.bin : firmware compile / OTA
          - TriCaster_Elite2_Tally_Manager.py : source Manager
          - README.md : documentation
          - TEST_PLAN_V4_2.md : plan de validation terrain

          V4.2 est la nouvelle base propre du firmware ESP8266.
          Le .ino et le .bin sont toujours publies ensemble.
          EOF
          cd release
          zip -r ../TriCaster_Elite2_WiFi_Tally_V4_2_COMPLETE.zip .
          cd ..
      - name: Release notes
        run: |
          cat > release_notes.md <<'EOF'
          ## TriCaster Elite 2 WiFi Tally V4.2.0

          Clean ESP8266 production baseline after isolating a defective test module.

          ### Main firmware changes
          - standard SSID/password association for startup and recovery
          - DHCP enabled by default for new units
          - current DHCP IP exposed to the Manager
          - serial Wi-Fi disconnect reason and station MAC diagnostics
          - conservative multi-AP roaming with 30 s startup grace
          - 30 s roaming scan interval, -72 dBm trigger, 10 dB minimum gain
          - setup portal, direct TriCaster polling, heartbeat diagnostics and authenticated OTA retained

          ### Downloads
          - **TriCaster_Elite2_Tally_Manager.exe** — Windows Manager
          - **TriCaster_Elite2_Tally_ESP8266_V4_2.ino** — Arduino source / USB recovery
          - **TriCaster_Elite2_Tally_ESP8266_V4_2.bin** — compiled firmware / OTA
          - **TriCaster_Elite2_WiFi_Tally_V4_2_COMPLETE.zip** — complete package

          Always validate a firmware on one tally before deploying it to a production fleet.
          EOF
      - name: Create or update V4.2 release
        run: |
          if gh release view v4.2.0 >/dev/null 2>&1; then
            gh release upload v4.2.0               release/TriCaster_Elite2_Tally_Manager.exe               release/TriCaster_Elite2_Tally_ESP8266_V4_2.ino               release/TriCaster_Elite2_Tally_ESP8266_V4_2.bin               TriCaster_Elite2_WiFi_Tally_V4_2_COMPLETE.zip               --clobber
          else
            gh release create v4.2.0               release/TriCaster_Elite2_Tally_Manager.exe               release/TriCaster_Elite2_Tally_ESP8266_V4_2.ino               release/TriCaster_Elite2_Tally_ESP8266_V4_2.bin               TriCaster_Elite2_WiFi_Tally_V4_2_COMPLETE.zip               --target "$GITHUB_SHA"               --title "TriCaster Elite 2 WiFi Tally V4.2.0"               --notes-file release_notes.md               --latest
          fi
